name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6' # .fvmrc 와 일치시킬 것
          channel: stable
          cache: true

      # 시크릿에 접근할 수 없는 컨텍스트(Dependabot·포크 PR)에서만 커밋된 더미로
      # 대체한다. 시크릿을 쓸 수 있는데 값이 비어 있으면 스크립트가 실패시킨다.
      - name: Restore secret files
        env:
          KEYS_DART: ${{ secrets.KEYS_DART }}
          CONFIG_DART: ${{ secrets.CONFIG_DART }}
          ALLOW_DUMMY: ${{ github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork }}
        run: bash .github/ci/restore_secret_files.sh

      - run: flutter pub get

      - run: flutter analyze --no-pub

  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6' # .fvmrc 와 일치시킬 것
          channel: stable
          cache: true

      # 시크릿에 접근할 수 없는 컨텍스트(Dependabot·포크 PR)에서만 커밋된 더미로
      # 대체한다. 시크릿을 쓸 수 있는데 값이 비어 있으면 스크립트가 실패시킨다.
      - name: Restore secret files
        env:
          KEYS_DART: ${{ secrets.KEYS_DART }}
          CONFIG_DART: ${{ secrets.CONFIG_DART }}
          ALLOW_DUMMY: ${{ github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork }}
        run: bash .github/ci/restore_secret_files.sh

      - run: flutter pub get

      - run: flutter test --no-pub --coverage

      - name: Verify coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 83
